name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - name: Install pinned Python and locked environment
        run: make setup
      - name: Lint, typecheck, test, and check docs
        run: make check
      - name: Synthetic two-stage smoke
        run: make smoke
  tokenizer-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
      - name: Independent third-party tokenizer training and encoding reference
        run: uv run --locked --extra baseline pytest tests/test_tokenizer_external.py
  evaluation-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
      - name: Locked Parquet intake tests on authored fixtures only
        run: uv run --locked --extra evaluation pytest tests/test_arc.py tests/test_opencode.py tests/test_stack_licenses.py tests/test_rehearsal_build.py tests/test_task_pool.py
