[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-coding-agent"
version = "0.1.0"
description = "From-scratch language model and Python coding agent research project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
scratchcoder = "scratchcoder.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scratchcoder"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
