[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-coding-agent"
version = "0.1.0"
description = "From-scratch language model and Python coding agent research project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6,<7",
    "torch>=2.6,<3",
    "numpy>=2,<3",
]

[project.scripts]
scratchcoder = "scratchcoder.cli:main"

[project.optional-dependencies]
tracking = [
    "wandb>=0.20,<1",
]
baseline = [
    "transformers>=4.49,<5",
]
evaluation = [
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-jsonschema>=4",
    "types-pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scratchcoder"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
